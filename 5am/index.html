<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>朝5時起き1週間 熟語帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sticky "now studying" strip on top, card grid below. Lessons coded like NYC subway line bullets. */
:root {
  --bg: #eef0f2;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5d6570;
  --line: #d9dde2;
  --bar: #15181d;
  --bar-ink: #f3f4f6;
  --bar-muted: #9aa3ad;
  --bar-field: #252a31;
  --accent: #0039a6;
  --soft: #f5f6f8;
  --l1: #ff6319; --l2: #0039a6; --l3: #00933c; --l4: #fccc0a; --l5: #ee352e;
  --l4-ink: #15181d;
  --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111418; --surface: #1a1e24; --ink: #e9ecef; --muted: #98a1ab; --line: #2c323a;
  --bar: #0a0c0f; --bar-ink: #f3f4f6; --bar-muted: #8b949e; --bar-field: #1d2229;
  --accent: #6d9cff; --soft: #22272e; --l2: #3f6fd6; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111418; --surface: #1a1e24; --ink: #e9ecef; --muted: #98a1ab; --line: #2c323a;
  --bar: #0a0c0f; --bar-ink: #f3f4f6; --bar-muted: #8b949e; --bar-field: #1d2229;
  --accent: #6d9cff; --soft: #22272e; --l2: #3f6fd6; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); line-height: 1.6; font-size: 15px; padding-bottom: env(safe-area-inset-bottom, 0px); }
.wrap { max-width: 1140px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.top { background: var(--bar); color: var(--bar-ink); padding-top: env(safe-area-inset-top, 0px); }
.title-row { padding-block: 14px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.title-row h1 { font-family: var(--display); font-size: 1.25rem; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
.title-row .meta { color: var(--bar-muted); font-size: 0.8rem; }

/* Player column: sticky beside the cards on wide screens, pinned to the top on phones. */
.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; padding-block: 20px 48px; }
.stage { background: var(--bar); color: var(--bar-ink); border-radius: 12px; overflow: hidden; align-self: start; }
.player { position: relative; aspect-ratio: 16 / 9; background: #000; }
.player iframe, .player #ytPlayer { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.player-fallback { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; color: var(--bar-muted); font-size: 0.85rem; }
.player-fallback a { color: #fff; font-weight: 700; }
.now { padding: 12px 14px 14px; display: grid; gap: 8px; }
.now-label { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--bar-muted); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.now-phrase { font-family: var(--display); font-weight: 700; font-size: 1.1rem; line-height: 1.35; }
.now-sub { font-size: 0.82rem; color: var(--bar-muted); }
.now-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pbtn { font: inherit; font-size: 0.8rem; font-weight: 700; background: var(--bar-field); color: var(--bar-ink); border: 1px solid #3a414a; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.pbtn[aria-pressed="true"] { background: var(--l3); border-color: var(--l3); color: #fff; }
.pbtn:disabled { opacity: 0.35; cursor: default; }
.yt { margin-left: auto; font-size: 0.8rem; font-weight: 700; color: var(--bar-ink); text-decoration: none; }
.yt:hover { text-decoration: underline; }

@media (min-width: 900px) {
  .layout { grid-template-columns: 420px minmax(0, 1fr); align-items: start; }
  .stage { position: sticky; top: 16px; }
}
@media (max-width: 899px) {
  .layout { padding-top: 0; }
  .stage { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; border-radius: 0; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); }
  .now { padding: 8px 14px 10px; gap: 6px; }
  .now-sub { display: none; }
  .now-phrase { font-size: 0.98rem; }
}

.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.controls input, .controls select { font: inherit; font-size: 0.85rem; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
.controls input { flex: 1 1 180px; min-width: 0; }
.tbtn { font: inherit; font-size: 0.82rem; font-weight: 700; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.tbtn[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.progress { display: flex; align-items: center; gap: 10px; font-size: 0.8rem; color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
.track { width: 110px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.fill { height: 100%; background: var(--l3); width: 0; transition: width .3s; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 14px; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.card.done { opacity: 0.6; }
.head { display: flex; align-items: center; gap: 8px; }
.bullet { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 0.82rem; color: #fff; flex: none; }
.bullet.l4 { color: var(--l4-ink); }
.no { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); }
.pos { font-size: 0.72rem; font-weight: 700; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; }
.time { margin-left: auto; font-family: var(--mono); font-size: 0.75rem; color: var(--muted); }
.phrase { font-family: var(--display); font-weight: 700; font-size: 1.2rem; line-height: 1.3; text-wrap: balance; }
.ans { border-top: 1px dashed var(--line); padding-top: 8px; display: grid; gap: 6px; }
.masking .ans.masked > * { filter: blur(6px); user-select: none; }
.masking .ans { cursor: pointer; }
.meaning { font-weight: 700; color: var(--accent); }
.note { font-size: 0.85rem; color: var(--muted); }
.ex { background: var(--soft); border-radius: 6px; padding: 8px 10px; font-size: 0.85rem; }
.ex-en { font-weight: 500; }
.ex-ja { color: var(--muted); }
.foot { display: flex; align-items: center; gap: 8px; margin-top: auto; padding-top: 4px; flex-wrap: wrap; }
.foot label { display: flex; gap: 6px; align-items: center; font-size: 0.85rem; color: var(--muted); cursor: pointer; }
.cbtn { font: inherit; font-size: 0.8rem; font-weight: 700; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
.cbtn:hover { border-color: var(--accent); color: var(--accent); }
.foot a { margin-left: auto; font-size: 0.8rem; font-weight: 700; color: var(--accent); text-decoration: none; }
.foot a:hover { text-decoration: underline; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header class="top">
  <div class="wrap title-row">
    <h1>朝5時起き1週間 熟語帳</h1>
    <span class="meta">「i woke up at 5am for a week」から拾った熟語 · 5チャプター</span>
  </div>
</header>

<div class="wrap layout">
  <aside class="stage">
    <div class="player">
      <div id="ytPlayer"></div>
      <div class="player-fallback" id="playerFallback" hidden>動画を読み込めませんでした。<br><a href="https://www.youtube.com/watch?v=Myp2On95hJM" target="_blank" rel="noopener">YouTubeで開く</a></div>
    </div>
    <div class="now" aria-live="polite">
      <div class="now-label"><span id="npStatus">カードの「この場面」を押すと再生</span><span id="npTime"></span></div>
      <div class="now-phrase" id="npPhrase">フレーズ未選択</div>
      <div class="now-sub" id="npSub">選んだ熟語の例文がここに出ます</div>
      <div class="now-actions">
        <button class="pbtn" id="replayBtn" type="button" disabled>↺ もう一度</button>
        <button class="pbtn" id="loopBtn" type="button" aria-pressed="false" disabled>区間リピート</button>
        <a class="yt" id="npLink" href="https://www.youtube.com/watch?v=Myp2On95hJM" target="_blank" rel="noopener">YouTube ↗</a>
      </div>
    </div>
  </aside>

  <main>
    <div class="controls">
      <input type="text" id="search" placeholder="英語・日本語で検索" aria-label="検索">
      <select id="lessonFilter" aria-label="レッスン">
        <option value="all">全レッスン</option>
        <option value="1">L1 Day 1: 初日の苦闘</option>
        <option value="2">L2 Day 2: 朝日とルーティン</option>
        <option value="3">L3 Day 2後半: スマホ断ちと疲労</option>
        <option value="4">L4 Day 3: 冷水洗顔と心の余裕</option>
        <option value="5">L5 Day 4〜総括: 複利効果とまとめ</option>
      </select>
      <button class="tbtn" id="maskBtn" aria-pressed="false">意味を隠す</button>
      <button class="tbtn" id="unlearnedBtn" aria-pressed="false">未習得のみ</button>
      <div class="progress"><span id="statsText">習得 0 / 0</span><div class="track"><div class="fill" id="fill"></div></div></div>
    </div>
    <div class="grid" id="cardGrid"></div>
  </main>
</div>

<script>
const rawIdioms = [
  { id: 1, lesson: 1, time: "00:00:05", sec: 5, endSec: 12, phrase: "get ready for bed", pos: "熟語", meaning: "寝る準備をする", note: "歯磨きやパジャマに着替えるなど、就寝前の身支度全般を指す定番表現。", exEn: "I am getting ready for bed because I'm going to wake up at 5:00 a.m. tomorrow morning.", exJa: "明日の朝5時に起きるので、もう寝る準備をしています。" },
  { id: 2, lesson: 1, time: "00:00:22", sec: 22, endSec: 30, phrase: "pitch black", pos: "形容詞句", meaning: "真っ暗な・漆黒の", note: "pitch（タール・黒ヤニ）のように真っ黒なことから「完全な暗闇」を表す強調表現。", exEn: "The fact that it's still completely pitch black outside... really makes me want to just go back to bed.", exJa: "外がまだ完全に真っ暗だという事実のせいで、本当にベッドに戻りたくなる。" },
  { id: 3, lesson: 1, time: "00:00:22", sec: 22, endSec: 30, phrase: "anytime soon", pos: "副詞句", meaning: "近いうちに・すぐには", note: "否定文や no sign of ~ と組み合わせて「当分〜しそうにない」という意味で頻出。", exEn: "...and no sign of the sun rising anytime soon...", exJa: "そして当分まだ日が昇る気配もない。" },
  { id: 4, lesson: 1, time: "00:00:49", sec: 49, endSec: 56, phrase: "light up / at once", pos: "句動詞・熟語", meaning: "パッと明るくなる（点灯する） / 一斉に・同時に", note: "lit up は light up の過去形。at once は「一度に・一斉に」。", exEn: "All of these lights just lit up at once.", exJa: "オフィスの照明がたった今、一斉にパッと点いた。" },
  { id: 5, lesson: 1, time: "00:01:05", sec: 65, endSec: 73, phrase: "internal conflict", pos: "名詞句", meaning: "心の葛藤・内なる葛藤", note: "「起きなきゃいけないのに二度寝したい」といった自分の中の迷いを少し大げさに表現している。", exEn: "If I don't get out of my apartment right now, I am about to get back into bed. I can feel the internal conflict I'm having.", exJa: "今すぐ部屋を出ないとベッドに戻っちゃいそう。自分の中の心の葛藤を感じる。" },
  { id: 6, lesson: 1, time: "00:01:42", sec: 102, endSec: 112, phrase: "early riser", pos: "名詞", meaning: "早起きの人・朝型人間", note: "early bird と同じ意味で、日常会話でよく使われる表現。", exEn: "Oh, we have an early riser. What a king.", exJa: "お、ここにも早起きの人がいるね。さすがだわ。" },
  { id: 7, lesson: 1, time: "00:02:04", sec: 124, endSec: 132, phrase: "treat oneself", pos: "熟語", meaning: "自分にご褒美をあげる・自分を甘やかす", note: "甘い飲み物やちょっとした贅沢を買うときの鉄板フレーズ。", exEn: "All right, I'm treating myself for, you know, this tragedy of a morning.", exJa: "よし、この悲劇みたいに辛い朝を乗り切るために、自分にご褒美をあげてるの。" },
  { id: 8, lesson: 1, time: "00:02:23", sec: 143, endSec: 154, phrase: "learn one's lesson", pos: "イディオム", meaning: "失敗から学ぶ・懲りる・いい教訓になる", note: "失敗した直後に「これで懲りたよ」「いい勉強になった」と言うときの決まり文句。", exEn: "Learned my lesson there. Couch is a no-go for me.", exJa: "これでいい教訓になったよ。朝のソファは私には絶対NG。" },
  { id: 9, lesson: 1, time: "00:02:29", sec: 149, endSec: 155, phrase: "a no-go", pos: "名詞（口語）", meaning: "立ち入り禁止・絶対ダメなこと（NG）", note: "「手を出してはいけない選択肢・不可能」をカジュアルに言う表現。", exEn: "Couch is a no-go for me.", exJa: "（二度寝しちゃうから）ソファは私にとって絶対NG。" },
  { id: 10, lesson: 1, time: "00:02:29", sec: 149, endSec: 158, phrase: "might as well ~", pos: "熟語", meaning: "どうせなら〜した方がいい・ついでに〜しよう", note: "「せっかくこんなに早く起きてるんだから、いっそ仕事始めちゃおう」という消極的・合理的な提案。", exEn: "Since I'm up this early, I might as well just like get started on work.", exJa: "せっかくこんなに早く起きてるんだから、いっそ仕事に取りかかっちゃおうかな。" },
  { id: 11, lesson: 1, time: "00:02:43", sec: 163, endSec: 172, phrase: "in theory", pos: "熟語", meaning: "理論上は・本来なら", note: "「普通なら（理論上は）11時半就寝は遅くないけど、5時起きなら話は別」という対比で使われる。", exEn: "I fell asleep at like 11:30, which in theory is not that late...", exJa: "11時半くらいに寝たんだけど、本来ならそこまで遅い時間じゃないよね。" },
  { id: 12, lesson: 1, time: "00:03:21", sec: 201, endSec: 209, phrase: "have it in me to ~", pos: "イディオム", meaning: "〜する気力・余力・根性が自分にある", note: "否定文 I don't have it in me to ~（〜する気力なんてない）でも非常によく使われる表現。", exEn: "Somehow I had it in me to work out. I actually don't have it in me, that this was pre-scheduled so I can't really cancel.", exJa: "どういうわけか運動する気力を振り絞れた。本当そんな余力ないんだけど、事前予約してたからキャンセルできなくて。" },
  { id: 13, lesson: 1, time: "00:03:31", sec: 211, endSec: 218, phrase: "push past it", pos: "句動詞", meaning: "（限界や疲れを）乗り越える・振り切る", note: "眠気や疲れのピークを通り越してハイになるような状態にも使える。", exEn: "I'm so tired that I feel like I pushed past it, so I'm doing fine now.", exJa: "疲れすぎて逆にそのピークを振り切った感じがするから、今は元気。" },
  { id: 14, lesson: 1, time: "00:03:55", sec: 235, endSec: 246, phrase: "sense of impending doom", pos: "慣用表現", meaning: "差し迫る破滅の予感（やばいことになる予感）", note: "夜更かししてしまい、翌朝5時起きが絶対辛いことが分かっている状況をユーモラスに大げさに言っている。", exEn: "I have this sense of impending doom upon me because I was supposed to get to bed early and here we are.", exJa: "早く寝るはずだったのにこんな時間（深夜0時過ぎ）になっちゃって、差し迫る破滅の予感に襲われてる。" },
  { id: 15, lesson: 2, time: "00:04:51", sec: 291, endSec: 302, phrase: "get ~ out of the way", pos: "イディオム", meaning: "（面倒なことや日課を）先に片付ける・済ませておく", note: "邪魔になるタスクを早い段階で終わらせてスッキリするときに使う超重要イディオム。", exEn: "Should I just go to the gym and like get my workout out of the way?", exJa: "いっそこのままジムに行って、ワークアウトを先に片付けちゃおうかな？" },
  { id: 16, lesson: 2, time: "00:05:13", sec: 313, endSec: 320, phrase: "seeing things", pos: "イディオム", meaning: "見間違いをする・幻覚を見る", note: "You are not seeing things. で「あなたの見間違いじゃないよ（本当に寝巻きのまま来たよ）」。", exEn: "I am wearing the same hoodie that I wore to bed. Yes, you are not seeing things.", exJa: "寝るときに着てたのと全く同じパーカーを着てます。はい、みんなの見間違いじゃないよ。" },
  { id: 17, lesson: 2, time: "00:05:29", sec: 329, endSec: 337, phrase: "turn out", pos: "句動詞", meaning: "結果的に〜になる・どういう結末になるか", note: "we all know how that would have turned out で「そんなことしたらどうなってたか、みんな分かるよね（絶対二度寝してたよね）」。", exEn: "This was me seriously contemplating sitting on the couch for just a couple minutes, but we all know how that would have turned out.", exJa: "ほんの数分だけソファに座ろうかと本気で悩んでる私。でも、そんなことしたらどうなってたか、みんなお察しの通りだよね。" },
  { id: 18, lesson: 2, time: "00:05:34", sec: 334, endSec: 342, phrase: "make it in time", pos: "熟語", meaning: "時間通りに間に合う", note: "make it だけでも「間に合う・たどり着く」を意味する。", exEn: "I made it in time to see the sunrise, which was so beautiful.", exJa: "日の出を見るのにちょうど間に合ったんだけど、すごくきれいだった。" },
  { id: 19, lesson: 2, time: "00:05:38", sec: 338, endSec: 345, phrase: "lift one's spirits", pos: "イディオム", meaning: "気分を高める・元気を出させる", note: "落ち込んでいた気分や眠気を吹き飛ばして前向きにしてくれるときに使う。", exEn: "It really like lifted my spirits. Honestly, I think this is probably the best way I could have started the morning.", exJa: "本当に気分が上がった。正直、朝のスタートとしてこれ以上ない最高の方法だったと思う。" },
  { id: 20, lesson: 2, time: "00:05:57", sec: 357, endSec: 365, phrase: "the latter", pos: "代名詞", meaning: "後者（2つのうちの後のほう）", note: "前半で「A（ヘトヘトになる）か、B（エネルギーが湧く）か」を挙げ、Bだったことを the latter で受けている（前者は the former）。", exEn: "I thought either after I would be super exhausted or have a lot of energy, and luckily it's the latter for me.", exJa: "終わった後はすごくヘトヘトになるか、逆にエネルギーが湧くかのどっちかだと思ってたけど、幸い私の場合は後者だった。" },
  { id: 21, lesson: 2, time: "00:06:16", sec: 376, endSec: 383, phrase: "my go-to", pos: "名詞（口語）", meaning: "私の定番・お気に入りの頼れるもの", note: "食べ物、お店、服など「迷ったらこれ！」という鉄板のお気に入りを指す現代英語の超頻出表現。", exEn: "Nothing brings me more joy than this smoothie. Um, you guys know it's my go-to.", exJa: "このスムージー以上に私を幸せにしてくれるものはないね。みんな知っての通り、私の定番。" },
  { id: 22, lesson: 2, time: "00:06:28", sec: 388, endSec: 395, phrase: "switch up / run out of ~", pos: "句動詞", meaning: "少し変える・変化をつける / 〜を切らす（使い果たす）", note: "いつもとレシピややり方を少し変えるときに switch up を使う。", exEn: "I had to switch up a little bit today cuz I ran out of frozen strawberries.", exJa: "冷凍イチゴを切らしちゃったから、今日はちょっと中身を変えなきゃいけなかった。" },
  { id: 23, lesson: 2, time: "00:06:32", sec: 392, endSec: 400, phrase: "set one's day up", pos: "句動詞", meaning: "1日の土台を作る・1日を良い流れに整える", note: "set up は「準備する・整える」。朝の習慣が1日の流れを作るという意味。", exEn: "I feel like these mornings are the best way to set your day up.", exJa: "こういう朝の時間こそが、1日を良い流れに整える最高の方法な気がする。" },
  { id: 24, lesson: 3, time: "00:07:01", sec: 421, endSec: 432, phrase: "lock someone out of ~", pos: "句動詞", meaning: "人を〜から締め出す・アクセスできなくする", note: "物理デバイスを使ってスマホのSNSアプリを強制的に開けなくする仕組みを説明している。", exEn: "It's a physical device that basically locks me out of my phone and my social media...", exJa: "これは基本的に私をスマホやSNSから締め出してくれる（開けなくする）物理デバイスなの。" },
  { id: 25, lesson: 3, time: "00:07:12", sec: 432, endSec: 439, phrase: "put into words", pos: "イディオム", meaning: "言葉にする・言葉で表現する", note: "I can't even put into words ~ で「言葉では言い表せないほど〜だ」。", exEn: "I can't even put into words how much it's helped me.", exJa: "これがどれだけ助けになったか、言葉では言い表せないくらい。" },
  { id: 26, lesson: 3, time: "00:07:36", sec: 456, endSec: 462, phrase: "cram things in", pos: "句動詞", meaning: "予定やタスクを無理やり詰め込む", note: "cram は「詰め込む（一夜漬けする）」。時間に余裕ができて、タスクをギチギチに詰め込まなくて済む状態。", exEn: "I feel like I have way more time to be productive and I'm not like cramming things in.", exJa: "生産的に過ごせる時間が圧倒的に増えた気がするし、予定を無理やり詰め込んでる感じがしない。" },
  { id: 27, lesson: 3, time: "00:07:41", sec: 461, endSec: 475, phrase: "in a sheer panic / go off", pos: "熟語・句動詞", meaning: "完全にパニックになって / （アラームが）鳴る", note: "sheer は「完全な・まったき」。また目覚まし時計が鳴ることは go off と表現する。", exEn: "I woke up five different times... in a sheer panic to look at the time on my phone. I must have been panicking that my alarm wouldn't go off...", exJa: "完全にパニックになってスマホの時間を見るために5回も目が覚めた。アラームが鳴らないんじゃないかってパニックになってたんだと思う。" },
  { id: 28, lesson: 3, time: "00:08:20", sec: 500, endSec: 508, phrase: "It finally hit me", pos: "慣用表現", meaning: "ついに（疲れや実感が）どっと押し寄せてきた", note: "眠気、疲労、カフェインの効果、あるいは重大な事実などが「急に自分に襲いかかってきた・実感した」ときに使う。", exEn: "I did switch locations, but it finally hit me now. I'm tired. It's official.", exJa: "場所を変えてみたんだけど、ここに来てついに（眠気が）どっと来た。疲れた。もう確定。" },
  { id: 29, lesson: 3, time: "00:08:32", sec: 512, endSec: 520, phrase: "ride it out", pos: "イディオム", meaning: "（寝ずに・休まずに）このまま乗り切る、やり過ごす", note: "嵐や苦境、眠気などを途中で投げ出さずに最後まで耐え抜くニュアンス。", exEn: "I don't know if I take a nap or if I just like ride it out. I might just ride it out till tonight.", exJa: "昼寝するか、それともこのまま夜まで乗り切るか迷う。夜までこのまま乗り切っちゃうかも。" },
  { id: 30, lesson: 3, time: "00:09:13", sec: 553, endSec: 562, phrase: "hang on by a thread", pos: "イディオム", meaning: "首の皮一枚でつながっている・ギリギリで踏みとどまっている", note: "動画内では hanging out by a thread と少し言い間違えているが、本来は hanging on by a thread（糸1本でぶら下がっている＝限界寸前）。", exEn: "I'm very exhausted even though I don't look like it. I'm like... barely hanging on by a thread at this point.", exJa: "そうは見えないかもしれないけど、めちゃくちゃ疲れてる。今の時点で、もうギリギリ糸1本で持ちこたえてる状態。" },
  { id: 31, lesson: 3, time: "00:09:37", sec: 577, endSec: 585, phrase: "To be fair", pos: "表現", meaning: "公平に言えば・言い訳させてもらうと", note: "「また寝るのが11時半になっちゃったけど、今日はイベントがあったから仕方ないよね」と状況を補足するときに使う。", exEn: "Problem is, it's already 11:30. To be fair, you know, I had an event tonight that I did have to go to.", exJa: "問題は、もう11時半だってこと。まあ言い訳させてもらうと、今夜は絶対行かなきゃいけないイベントがあったからね。" },
  { id: 32, lesson: 4, time: "00:10:00", sec: 600, endSec: 608, phrase: "dread / dreading", pos: "動詞", meaning: "〜をひどく嫌がる・気が重い・憂鬱に思う", note: "「朝ベッドから出るのが本当に億劫・嫌だ」という感覚を表すのにぴったりの動詞。", exEn: "I always dread to get out of bed.", exJa: "ベッドから出るのはいつだって本当に気が重い。" },
  { id: 33, lesson: 4, time: "00:10:15", sec: 615, endSec: 623, phrase: "use it to one's advantage", pos: "熟語", meaning: "それを自分の強み（有利）に活かす", note: "せっかく早起きできたことを活かして行動しよう、という前向きな表現。", exEn: "I need to use it to my advantage that I woke up early because I can't let this go to waste.", exJa: "せっかく早起きできたんだから、これを無駄にするわけにはいかないし、有効活用しなきゃ。" },
  { id: 34, lesson: 4, time: "00:10:18", sec: 618, endSec: 625, phrase: "let ~ go to waste", pos: "熟語", meaning: "〜を無駄にする・宝の持ち腐れにする", note: "せっかくの時間やチャンスを無駄にしてしまうこと。", exEn: "...because I can't let this go to waste. This is huge for me.", exJa: "だってこの早起きを無駄にはできないからね。私にとってはすごいことなんだから。" },
  { id: 35, lesson: 4, time: "00:10:47", sec: 647, endSec: 655, phrase: "figure something out", pos: "句動詞", meaning: "解決策を見つけ出す・コツをつかむ", note: "試行錯誤の末に「あ、こうすればいいんだ！」と発見したときの定番表現。", exEn: "I think I figured something out, guys. Something that helps me in the morning.", exJa: "みんな、朝を乗り切る良い方法をついに見つけ出したと思う。" },
  { id: 36, lesson: 4, time: "00:11:20", sec: 680, endSec: 687, phrase: "take precautions", pos: "熟語", meaning: "予防策をとる・用心する", note: "ソファに座ると二度寝してしまうため、あえて床に座ることを「重大な予防策（serious precautions）」とユーモラスに表現している。", exEn: "I'm sitting on the floor because if I was sitting on the couch we all know what would happen. So I'm taking some serious precautions here.", exJa: "ソファに座ったらどうなるか分かってるから、床に座ってます。万全の予防策をとってるわけ。" },
  { id: 37, lesson: 4, time: "00:11:26", sec: 686, endSec: 695, phrase: "missing in action (MIA)", pos: "イディオム", meaning: "行方不明になって・どこかに消えて", note: "元々は軍事用語（戦闘中行方不明）だが、日常会話では「ペンや小物がどこかに消えて見つからない」ときに冗談っぽくよく使う。", exEn: "I also wish I had a pen, but that is currently missing in action, so I'm just going to use a Sharpie.", exJa: "ペンがあればよかったんだけど、現在行方不明中なので、マッキー（油性ペン）を使います。" },
  { id: 38, lesson: 4, time: "00:11:36", sec: 696, endSec: 704, phrase: "start one's day off right", pos: "熟語", meaning: "1日を気持ちよく（正しい形で）スタートさせる", note: "start off right で「幸先の良いスタートを切る」。", exEn: "I think gratitude journals and things like that really can like start your day off right.", exJa: "感謝日記みたいなものって、1日を本当に気持ちよくスタートさせてくれると思う。" },
  { id: 39, lesson: 4, time: "00:11:46", sec: 706, endSec: 713, phrase: "I could use ~", pos: "会話表現", meaning: "〜が欲しいところだ・〜があるとありがたい", note: "直訳は「〜を使える」だが、I could use some coffee. で「コーヒーが1杯欲しいな（飲みたいな）」という意味になる超自然な口語表現。", exEn: "As much as I wish that this tea would sustain me, I think I could use some Dunkin'.", exJa: "このお茶だけで持ちこたえられたらいいんだけど、やっぱりダンキンドーナツのコーヒーが欲しいところだね。" },
  { id: 40, lesson: 4, time: "00:12:06", sec: 726, endSec: 735, phrase: "one step behind / one step ahead", pos: "熟語", meaning: "一歩遅れて（後手に回って） / 一歩先んじて（先手を打って）", note: "chasing the day（1日に追われる）状態から、早起きによって一歩リードしている感覚への変化。", exEn: "I feel like I'm always trying to catch up on things and I'm like one step behind... but this makes me feel like I'm one step ahead of everything.", exJa: "いつもやるべきことに追われて一歩後手に回ってる感じがするけど、早起きするとすべてに対して一歩先んじている気持ちになれる。" },
  { id: 41, lesson: 4, time: "00:12:10", sec: 730, endSec: 736, phrase: "have so much on one's plate", pos: "イディオム", meaning: "やるべきこと（抱えている仕事）が山積みである", note: "お皿（plate）の上に料理が山盛りになっているイメージから、「抱えているタスクが多い」ことを表すビジネス・日常の最頻出表現。", exEn: "I have so much on my plate, but this makes me feel like I'm one step ahead of everything.", exJa: "抱えているタスクが山積みなんだけど、早起きのおかげで全部に先手を打てている気がする。" },
  { id: 42, lesson: 5, time: "00:13:52", sec: 832, endSec: 842, phrase: "hold someone accountable", pos: "熟語", meaning: "人に責任を持たせる・（サボらないよう）見張る", note: "「視聴者のみんなに企画として見られているから、サボらずに起きられた」という文脈。", exEn: "Honestly, if it wasn't for you guys holding me accountable, I don't know what today would have looked like.", exJa: "正直、もしみんながこうして私のことを見届けてくれていなかったら、今日がどうなっていたか分からない。" },
  { id: 43, lesson: 5, time: "00:14:03", sec: 843, endSec: 853, phrase: "go downhill", pos: "イディオム", meaning: "坂を転げ落ちるように悪化する・ダメになる", note: "朝ベッドの中で「起きようか、二度寝しようか」と議論を始めると、そこから状況が悪化する（二度寝してしまう）ことを表している。", exEn: "I think what gets me into trouble is entertaining the debate in my head of should I get up, should I go back to sleep. That's when things are going downhill.", exJa: "起きるべきか二度寝するべきか頭の中で議論を始めちゃうのがいけないんだよね。それを始めるとすべてがダメになる。" },
  { id: 44, lesson: 5, time: "00:14:22", sec: 862, endSec: 870, phrase: "compound effect", pos: "名詞句", meaning: "複利効果・相乗効果", note: "小さな行動の積み重ねが連鎖して大きな成果やモチベーションを生むこと。", exEn: "It is such a compound effect. The more you get stuff done, the more personally I'm motivated to continue getting stuff done.", exJa: "これって本当に複利効果（相乗効果）なんだよね。物事が片付けば片付くほど、もっと続けようっていうモチベーションが湧いてくる。" },
  { id: 45, lesson: 5, time: "00:14:58", sec: 898, endSec: 907, phrase: "out of habit", pos: "熟語", meaning: "いつもの癖で・無意識の習慣で", note: "特に用もないのに、手癖でついスマホに手を伸ばしてしまう（reach for it out of habit）状況。", exEn: "It helps me so much to like not go on my phone. I think I just reach for it out of habit so much.", exJa: "スマホを見ないようにするのにすごく役立ってる。私、本当にただの癖でスマホに手を伸ばしちゃってるんだと思う。" },
  { id: 46, lesson: 5, time: "00:15:26", sec: 926, endSec: 935, phrase: "scramble to ~", pos: "動詞", meaning: "大慌てで〜する・バタバタと〜する", note: "時間に追われて焦りながらタスクを片付けるニュアンス。", exEn: "Usually I feel like I'm always scrambling to get things done, but this week I've gotten like everything done.", exJa: "普段はいつもバタバタと大慌てで仕事を片付けてる感じがするんだけど、今週やるべきことが全部終わった。" },
  { id: 47, lesson: 5, time: "00:15:43", sec: 943, endSec: 954, phrase: "sleep in", pos: "句動詞", meaning: "朝遅くまで寝る・朝寝坊する（ゆっくり寝る）", note: "ネガティブな「寝坊（oversleep）」とは違い、「休日に目覚ましをかけずにゆっくり朝遅くまで寝る」というポジティブな意味で使われる。", exEn: "I knew I was going to sleep in, and I was so excited to finally be able to sleep in after waking up at 5:00 a.m. for a few days.", exJa: "今日はゆっくり朝遅くまで寝るって決めてたし、数日間5時起きを続けた後にやっとゆっくり寝られるのが本当に楽しみだった。" },
  { id: 48, lesson: 5, time: "00:16:06", sec: 966, endSec: 974, phrase: "back to one's roots", pos: "イディオム", meaning: "自分のルーツ（原点・故郷）に戻る", note: "地元ミネソタに帰省したことを指して使っている。", exEn: "Guys, I'm back to my roots. I'm in Minnesota.", exJa: "みんな、自分のルーツ（故郷）に戻ってきたよ。今ミネソタにいます。" },
  { id: 49, lesson: 5, time: "00:16:25", sec: 985, endSec: 993, phrase: "come up with ~", pos: "句動詞", meaning: "〜を思いつく・考案する", note: "注文窓口で即興で思いついたドリンクのカスタム（concoction＝調合品）について話している。", exEn: "So I tried this like blueberry vanilla concoction that I just came up with at the window.", exJa: "ドライブスルーの窓口でぱっと思いついた、ブルーベリーバニラの特製カスタムを試してみたの。" },
  { id: 50, lesson: 5, time: "00:17:40", sec: 1060, endSec: 1078, phrase: "follow through on ~", pos: "句動詞", meaning: "（決めたことや約束を）最後までやり通す・実行に移す", note: "自分で「朝5時に起きてジムに行く」と決めたことを、口先だけでなく最後までやり抜くこと。", exEn: "It's just not the same as being diligent and following through on like what I said that I was going to do.", exJa: "やっぱり、自分に誠実になって「やる」と言ったことを最後までやり通すのとは全然違うんだよね。" },
];

const VID = 'Myp2On95hJM';
const KEY = 'idioms_' + VID;
const ytUrl = s => `https://www.youtube.com/watch?v=${VID}&t=${s}s`;
function fmt(s) { return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; }

let learned = new Set();
try { learned = new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch (e) {}
let current = null, masking = false, onlyUnlearned = false;

const $ = id => document.getElementById(id);
const grid = $('cardGrid');

function save() {
  try { localStorage.setItem(KEY, JSON.stringify([...learned])); } catch (e) {}
  $('statsText').textContent = `習得 ${learned.size} / ${rawIdioms.length}`;
  $('fill').style.width = (learned.size / rawIdioms.length * 100) + '%';
}

// Embedded player (YouTube IFrame Player API). Falls back to a plain link if the API never loads.
let player = null, playerReady = false, looping = false, pendingSeek = null;
window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player('ytPlayer', {
    videoId: VID,
    playerVars: { playsinline: 1, rel: 0, modestbranding: 1 },
    events: {
      onReady: () => {
        playerReady = true;
        if (pendingSeek !== null) { playFrom(pendingSeek); pendingSeek = null; }
      }
    }
  });
};
(() => {
  const s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  s.onerror = () => { $('playerFallback').hidden = false; };
  document.head.appendChild(s);
})();

function playFrom(sec) {
  if (!playerReady) { pendingSeek = sec; return; }
  player.seekTo(sec, true);
  player.playVideo();
}

// While 区間リピート is on, jump back to the start of the selected scene once it passes the end.
setInterval(() => {
  if (!looping || !current || !playerReady || typeof player.getCurrentTime !== 'function') return;
  const t = player.getCurrentTime();
  if (t >= current.endSec || t < current.sec - 1) player.seekTo(current.sec, true);
}, 300);

function select(item) {
  current = item;
  $('npStatus').textContent = `L${item.lesson} · No.${item.id}`;
  $('npTime').textContent = `${fmt(item.sec)}〜${fmt(item.endSec)}`;
  $('npPhrase').textContent = `${item.phrase}（${item.meaning}）`;
  $('npSub').textContent = `${item.exEn} / ${item.exJa}`;
  $('npLink').href = ytUrl(item.sec);
  $('replayBtn').disabled = false;
  $('loopBtn').disabled = false;
  playFrom(item.sec);
  render();
}

$('replayBtn').addEventListener('click', () => { if (current) playFrom(current.sec); });
$('loopBtn').addEventListener('click', e => {
  looping = !looping;
  e.currentTarget.setAttribute('aria-pressed', looping);
  if (looping && current) playFrom(current.sec);
});

function render() {
  const q = $('search').value.trim().toLowerCase();
  const l = $('lessonFilter').value;
  grid.innerHTML = '';
  let shown = 0;
  rawIdioms.forEach(item => {
    const done = learned.has(item.id);
    if (l !== 'all' && String(item.lesson) !== l) return;
    if (onlyUnlearned && done) return;
    if (q && ![item.phrase, item.meaning, item.note, item.exEn, item.exJa].some(t => t.toLowerCase().includes(q))) return;
    shown++;
    const on = current && current.id === item.id;
    const card = document.createElement('article');
    card.className = `card${done ? ' done' : ''}${on ? ' on' : ''}`;
    card.innerHTML = `
      <div class="head">
        <span class="bullet l${item.lesson}" style="background:var(--l${item.lesson})" title="Lesson ${item.lesson}">${item.lesson}</span>
        <span class="no">No.${item.id}</span>
        <span class="pos">${item.pos}</span>
        <span class="time">${fmt(item.sec)}〜${fmt(item.endSec)}</span>
      </div>
      <div class="phrase">${item.phrase}</div>
      <div class="ans${masking ? ' masked' : ''}" title="${masking ? 'タップで表示' : ''}">
        <div class="meaning">${item.meaning}</div>
        <div class="note">${item.note}</div>
        <div class="ex"><div class="ex-en">${item.exEn}</div><div class="ex-ja">${item.exJa}</div></div>
      </div>
      <div class="foot">
        <label><input type="checkbox" id="learned-${item.id}" ${done ? 'checked' : ''}> 覚えた</label>
        <button class="cbtn" type="button">${on ? '再生中' : '▶ この場面'}</button>
        <a href="${ytUrl(item.sec)}" target="_blank" rel="noopener">YouTube ↗</a>
      </div>`;
    card.querySelector('.cbtn').addEventListener('click', () => select(item));
    card.querySelector('input').addEventListener('change', e => {
      e.target.checked ? learned.add(item.id) : learned.delete(item.id);
      save(); render();
    });
    card.querySelector('.ans').addEventListener('click', e => { if (masking) e.currentTarget.classList.toggle('masked'); });
    grid.appendChild(card);
  });
  if (!shown) grid.innerHTML = '<p class="empty">条件に合う熟語はありません。検索語やフィルターを変えてください。</p>';
  save();
}

$('search').addEventListener('input', render);
$('lessonFilter').addEventListener('change', render);
$('maskBtn').addEventListener('click', e => {
  masking = !masking;
  document.body.classList.toggle('masking', masking);
  e.currentTarget.setAttribute('aria-pressed', masking);
  render();
});
$('unlearnedBtn').addEventListener('click', e => {
  onlyUnlearned = !onlyUnlearned;
  e.currentTarget.setAttribute('aria-pressed', onlyUnlearned);
  render();
});
render();
</script>
